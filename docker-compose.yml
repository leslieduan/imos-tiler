services:
  app:
    build: .
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # As only allow ssh tunnel to call port 8000, set only listens to request to port 8000 from local.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./slice_cache:/app/slice_cache
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - TILE_TIMEZONE=${TILE_TIMEZONE:-Australia/Sydney}
      - STORE_TTL_SECONDS=${STORE_TTL_SECONDS:-600}
      # S3_ANON=true (default) uses anonymous access for s3:// URLs — correct for IMOS's
      # public AODN buckets. Set false to let fsspec discover AWS credentials for private
      # buckets via env vars, ~/.aws/credentials, or IAM role.
      - S3_ANON=${S3_ANON:-true}
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:-100}
      - SLICE_CACHE_SIZE=${SLICE_CACHE_SIZE:-10}
      - PROCESSED_CACHE_SIZE=${PROCESSED_CACHE_SIZE:-50}
      - DISK_CACHE_LIMIT_GB=${DISK_CACHE_LIMIT_GB:-20}
      - DISK_EVICTION_THRESHOLD=${DISK_EVICTION_THRESHOLD:-0.85}
      - CACHE_DAYS=${CACHE_DAYS:-30}
      - PREWARM_WORKERS=${PREWARM_WORKERS:-4}
      - CACHE_REFRESH_INTERVAL_SECONDS=${CACHE_REFRESH_INTERVAL_SECONDS:-14400}
      # LOG_FORMAT is not set here: Docker stdout is not a TTY, so log_config.py
      # auto-selects JSON. Set LOG_FORMAT=text on the host to force human-readable
      # output (e.g. for a debugging session via `docker run -it`).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SLOW_FETCH_THRESHOLD_SECONDS=${SLOW_FETCH_THRESHOLD_SECONDS:-5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /titiler/app
        awslogs-stream: app
        awslogs-create-group: "true"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /titiler/nginx
        awslogs-stream: nginx
        awslogs-create-group: "true"

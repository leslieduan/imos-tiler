services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TILE_TIMEZONE=${TILE_TIMEZONE:-Australia/Sydney}
      - STORE_TTL_SECONDS=${STORE_TTL_SECONDS:-600}
      # S3_ANON=true (default) uses anonymous access for s3:// URLs — correct for IMOS's
      # public AODN buckets. Set false to let fsspec discover AWS credentials for private
      # buckets via env vars, ~/.aws/credentials, or IAM role.
      - S3_ANON=${S3_ANON:-true}
      # Per-socket S3 timeouts (botocore). connect_timeout bounds DNS + TCP/TLS
      # handshake; read_timeout is per-read inactivity, not total request
      # duration — zarr chunks are MB-sized so 30s has lots of headroom.
      - S3_CONNECT_TIMEOUT=${S3_CONNECT_TIMEOUT:-5}
      - S3_READ_TIMEOUT=${S3_READ_TIMEOUT:-30}
      - S3_MAX_ATTEMPTS=${S3_MAX_ATTEMPTS:-2}
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:-100}
      - SLICE_CACHE_TTL_SECONDS=${SLICE_CACHE_TTL_SECONDS:-600}
      - PROCESSED_CACHE_TTL_SECONDS=${PROCESSED_CACHE_TTL_SECONDS:-600}
      # CACHE_BACKEND=none (default) disables L1/L2 caching entirely.
      # Set to redis + REDIS_URL to point at a shared ElastiCache endpoint (ECS
      # multi-instance deployments); see docs/technical.md §10.5.
      - CACHE_BACKEND=${CACHE_BACKEND:-none}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_LOCK_TTL_SECONDS=${REDIS_LOCK_TTL_SECONDS:-30}
      - REDIS_WAIT_TIMEOUT_SECONDS=${REDIS_WAIT_TIMEOUT_SECONDS:-15}
      - ANIMATION_WORKERS=${ANIMATION_WORKERS:-10}
      # LOG_FORMAT is not set here: Docker stdout is not a TTY, so log_config.py
      # auto-selects JSON. Set LOG_FORMAT=text on the host to force human-readable
      # output (e.g. for a debugging session via `docker run -it`).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      # driver: awslogs
      driver: json-file
      # options:
      #   awslogs-region: ap-southeast-2
      #   awslogs-group: /titiler/app
      #   awslogs-stream: app
      #   awslogs-create-group: "true"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all

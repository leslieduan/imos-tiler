services:
  app:
    build: .
    # As only allow ssh tunnel to call port 8000, set only listens to request to port 8000 from local.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./slice_cache:/app/slice_cache
    environment:
      - PYTHONUNBUFFERED=1
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - PRODUCTS_CONFIG_PATH=data/products.json
      - COLORMAPS_CONFIG_PATH=data/colormaps.json
      - STORE_TTL_SECONDS=${STORE_TTL_SECONDS:-600}
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:-100}
      - SLICE_CACHE_SIZE=${SLICE_CACHE_SIZE:-100}
      - PROCESSED_CACHE_SIZE=${PROCESSED_CACHE_SIZE:-400}
      - DISK_CACHE_PATH=/app/slice_cache
      - DISK_CACHE_LIMIT_GB=${DISK_CACHE_LIMIT_GB:-20}
      - DISK_EVICTION_THRESHOLD=${DISK_EVICTION_THRESHOLD:-0.85}
      - CACHE_DAYS=${CACHE_DAYS:-30}
      - PREWARM_WORKERS=${PREWARM_WORKERS:-4}
      - CACHE_REFRESH_INTERVAL_SECONDS=${CACHE_REFRESH_INTERVAL_SECONDS:-14400}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /titiler/app
        awslogs-stream: app
        awslogs-create-group: "true"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-2
        awslogs-group: /titiler/nginx
        awslogs-stream: nginx
        awslogs-create-group: "true"

[project]
name = "titiler-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.0.6",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "netcdf4>=1.7.4",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "s3fs>=2026.3.0",
    "scipy>=1.17.1",
    "titiler-core>=2.0.2",
    "uvicorn>=0.46.0",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "types-cachetools>=5.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI uses function calls in defaults; E501: handled by formatter

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["services.*"]
ignore_errors = true  # xarray/numpy stubs don't model str|list[str] indexing well

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

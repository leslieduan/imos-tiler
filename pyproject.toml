[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project]
name = "imos-tiler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.0.6",
    "dask[array]>=2026.3.0",
    "fastapi>=0.136.1",
    "lz4>=4.4.5",
    "matplotlib>=3.10.9",
    "numba>=0.65.1",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "redis>=5.0",
    "rio-tiler>=9.0.6",
    "rioxarray>=0.22.0",
    "s3fs>=2026.3.0",
    "scipy>=1.17.1",
    "uvicorn>=0.46.0",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
    "types-cachetools>=5.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI uses function calls in defaults; E501: handled by formatter

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.services.*"]
ignore_errors = true  # xarray/numpy stubs don't model str|list[str] indexing well

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_prewarm: opt out of the default prewarm patch so the real _spawn_prewarm runs",
    "real_validate: opt out of the default _validate_store stub so the real one runs",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

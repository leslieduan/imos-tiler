# HTTP: redirect everything to HTTPS.
server {
    listen 80;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate TLS here, proxy plaintext to the app on the internal network.
server {
    listen 443 ssl;

    # Self-signed cert (demo). Generated on the host into ./docker/certs and
    # mounted read-only — see docker-compose.yml. Browsers show a one-time
    # "not private" warning because no CA vouches for it; the traffic is still
    # fully encrypted. Replace with a CA-issued cert (Let's Encrypt/ACM) once
    # this has a real domain name.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;

    location /admin {
        return 403;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

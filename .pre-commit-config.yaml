repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [.]

      - id: check-commit-msg
        name: Conventional commit message
        entry: hooks/check-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: check-branch-name
        name: Branch naming convention
        entry: hooks/check-branch-name.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
